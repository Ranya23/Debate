.btn.s{width:auto;padding:9px 14px;font-size:14px}.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}

.team{border-inline-start:6px solid var(--A)}.team.B{border-inline-start-color:var(--B)}

.crit input{grid-column:1/3;width:100%;height:34px;accent-color:var(--A)}.team.B .crit input{accent-color:var(--B)}
.crit output{font-weight:800;font-variant-numeric:tabular-nums}
.rk{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--paper);margin-top:8px}
.rk.w{background:#d6f5ea;outline:2px solid var(--win)}
.rk i{font:800 24px/1 system-ui;font-style:normal;width:30px;text-align:center}
.rk div{flex:1}.rk small{display:block;color:var(--mut)}.rk em{font:800 24px/1 system-ui;font-style:normal;font-variant-numeric:tabular-nums}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:14px;padding:18px;margin-top:10px;font:700 18px system-ui,"Noto Sans Arabic";color:#fff;text-align:start;cursor:pointer}
.o0{background:#1f5eff}.o1{background:#e8590c}.o2{background:#0f9d6e}.o3{background:#8a3ffc}
.opt[disabled]{cursor:default}.opt.dim{opacity:.3}.opt.win{outline:4px solid var(--ink)}.opt.sel{outline:4px solid #ffd43b}
.opt em{font-style:normal;background:#0003;border-radius:99px;padding:2px 12px}
.bar{flex:1;height:10px;border-radius:9px;background:#e8edf3;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);width:100%}
.ctr{text-align:center}.ctr #q{display:grid;place-items:center;margin:16px 0}
.ov{position:fixed;inset:0;background:#fff;z-index:9;display:grid;place-content:center;justify-items:center;text-align:center;padding:20px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:20;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ok{color:var(--win);font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

let lang=localStorage.vd_l||'en',R=()=>{};

function qview(s,m){const big=m=='s';
 if(s.phase=='lobby')return`<div class="card ctr"><h2>${E(s.title)}</h2><p>${T(big?'scan':'wait')}</p>${big?`<div id=q></div><div class=code>${C}</div>`:''}<p><b>${s.n}</b> ${T('plr')}</p></div>`;
 if(s.phase=='end')return`<div class=card><h2>${T('fin')}</h2>${s.me&&!big?`<p>${T('rank')} ${s.me.rank}, ${s.me.score} ${T('pts')}</p>`:''}${lb(s.top)}</div>`;
 const q=s.q,r=s.phase=='r',me=s.me&&s.me.ans;
 let h=`<div class=card><div class=row><b>${T('qn')} ${s.qi+1}/${s.total}</b>${r?'':'<div class=bar><i id=tb></i></div>'}</div><h2 style="font-size:${big?30:22}px;margin-top:10px">${E(q.q)}</h2>`;
 h+=q.o.map((o,i)=>`<button class="opt o${i}${r&&i==q.c?' win':''}${r&&i!=q.c?' dim':''}${me&&me.ch==i?' sel':''}" ${big||r||me?'disabled':''} data-ch=${i}><span>${SH[i]} ${E(o)}</span>${r?`<em>${s.counts[i]}</em>`:''}</button>`).join('');
 if(big&&!r)h+=`<p>${s.ans_n}/${s.n} ${T('ans')}</p>`;
 if(!big&&me&&!r)h+=`<p class=ok>${T('locked')}</p>`;
 if(!big&&r)h+=`<p class="${me&&me.pts>0?'ok':''}"><b>${me?(me.pts>0?T('ok')+' +'+me.pts:T('no')):T('tu')}</b></p><p>${T('rank')} ${s.me.rank}, ${s.me.score} ${T('pts')}</p>`;

  app.onclick=async e=>{const b=e.target.closest('[data-ch]');if(!b||b.disabled)return;try{await rpc('vq_answer',{c:C,tok,ch:+b.dataset.ch});await qget()}catch(er){toast(er.message)}};return}
 app.onclick=null;app.innerHTML=`<div class=card><h2>${E(S.title)}</h2><p>${T('qjp')}</p><input id=n type=text maxlength=40 placeholder="${T('nm')}" value="${E(localStorage.vd_n||'')}"><input id=g type=text maxlength=30 placeholder="${T('gr')}" value="${E(localStorage.vd_g||'')}"><button class=btn id=go>${T('enter')}</button></div>`;

 app.innerHTML=`<div class=card><h2>${T('joinT')}</h2><p>${T('joinP')}</p><input id=c class=digits type=text inputmode=numeric maxlength=4 placeholder="0000" value="${E(c)}" autocomplete=off><button class=btn id=go>${T('go')}</button></div>`;

function screen(c){C=c;app.className='';document.querySelector('main').classList.add('wide');clearInterval(poll);let k0='';
 const f=async()=>{let kind='q';try{S=stamp(await rpc('vq_state',{c,tok:'-'}))}catch(e){try{S=await rpc('vd_get',{c});kind='d'}catch(er){app.innerHTML=`<div class=card>${E(er.message)}</div>`;return}}
  const k=[kind,S.phase,S.qi,S.n,S.ans_n,S.released,S.status,lang].join('|');if(k==k0)return;k0=k;
  if(kind=='q'){app.innerHTML=qview(S,'s');if(S.phase=='lobby')mkqr($('#q'),c,280)}
  else if(S.released)app.innerHTML=`<div class=card><h2>${E(S.title)}</h2><p>${T('res')}</p>${board(S)}</div>`;
  else{app.innerHTML=`<div class="card ctr"><h2>${E(S.title)}</h2><p>${E(S.group_a)} / ${E(S.group_b)}</p><p>${T('scan')}</p><div id=q></div><div class=code>${c}</div></div>`;mkqr($('#q'),c,280)}};
 R=()=>{k0='';f()};f();poll=setInterval(f,1500)}

/* ---------- Export (Excel and Word, everything in one file) ---------- */
const r2=v=>Math.round(v*100)/100;
const rowsD=d=>calc(d).map((x,i)=>{const o={Debate:d.title,Rank:i+1,Group:x.name,Members:x.mem.join(', '),Votes:x.n};d.rubric.forEach((r,j)=>o[`${r.name} (/${r.max})`]=r2(x.cr[j]));return{...o,'Peer total':r2(x.avg),'Peer %':r2(x.sp),'Teacher score':x.t??'','Teacher %':x.tp==null?'':r2(x.tp),'Teacher weight %':d.w_teacher,'Final %':r2(x.f)}});
const rowsM=d=>calc(d).flatMap(x=>x.mem.map(m=>({Debate:d.title,Group:x.name,Student:m})));
const rowsQ=z=>z.players.map((p,i)=>{const o={Quiz:z.title,Rank:i+1,Name:p.name,Group:p.grp,Score:p.score};z.questions.forEach((_,j)=>{const a=p.ans.find(a=>a.qi==j);o['Q'+(j+1)]=a?a.pts:0});return o});
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
const tb=r=>r.length?'<table><tr>'+Object.keys(r[0]).map(k=>`<th>${E(k)}</th>`).join('')+'</tr>'+r.map(o=>'<tr>'+Object.values(o).map(v=>`<td>${E(v)}</td>`).join('')+'</tr>').join('')+'</table>':'';
function ex(f,ds,qs){const n='verdict-'+new Date().toISOString().slice(0,10);if(!ds.length&&!qs.length)return toast(T('none'));
 if(f=='x'){if(!window.XLSX)return toast('Excel library not loaded. Check your connection.');const wb=XLSX.utils.book_new(),add=(r,s)=>r.length&&XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),s.replace(/[\\\/?*\[\]:]/g,'').slice(0,31));
  add(ds.flatMap(rowsD),'Assessment');add(ds.flatMap(rowsM),'Members');qs.forEach((z,i)=>add(rowsQ(z),`Quiz ${i+1} ${z.title}`));XLSX.writeFile(wb,n+'.xlsx')}
 else{let h='<h1>Verdict</h1>';ds.forEach(d=>h+=`<h2>${E(d.title)}</h2>`+tb(rowsD(d))+(rowsM(d).length?`<h3>${T('mems')}</h3>`+tb(rowsM(d)):''));qs.forEach(z=>h+=`<h2>${E(z.title)}</h2>`+tb(rowsQ(z)));
  dl(new Blob(['\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Calibri,Tahoma,Arial}table{border-collapse:collapse;margin-bottom:14px}td,th{border:1px solid #888;padding:4px 8px}th{background:#0d1b2a;color:#fff}</style></head><body dir="'+(lang=='ku'?'rtl':'ltr')+'">'+h+'</body></html>'],{type:'application/msword'}),n+'.doc')}}

/* ---------- Teacher ---------- */
let P=sessionStorage.vp||'',L=[],Q=[],tab='a',tp;
const load=async()=>{[L,Q]=await Promise.all([rpc('vd_list',{p:P}),rpc('vq_list',{p:P}).catch(()=>[])])};
function login(){R=login;app.onclick=null;app.innerHTML=`<div class=card><h2>${T('tp')}</h2><p>${T('pass')}</p><input id=p type=password autocomplete=current-password><button class=btn id=go>${T('in')}</button></div>`;
 $('#go').onclick=async()=>{P=$('#p').value;try{await load();sessionStorage.vp=P;dash()}catch(e){toast(e.message)}}}
const dcard=d=>{const mx=d.rubric.reduce((s,r)=>s+r.max,0);return`<div class=card data-id=${d.id}><div class=row><h2>${E(d.title)}</h2><span class="tag ${d.status=='open'?'on':''}">${d.status=='open'?T('open'):T('cl')}</span></div>
<p>${E(d.group_a)} / ${E(d.group_b)}</p><div class=code>${d.code}</div>
<div class=row><button class="btn s" data-a=qr>${T('qr')}</button><button class="btn o s" data-a=tg>${d.status=='open'?T('close'):T('reopen')}</button><button class="btn o s" data-a=rel>${d.released?T('hide'):T('rel')}</button></div>
<p style="margin-top:14px">${T('ys')} ${mx}</p><div class=row><input type=number class=ta min=0 max=${mx} placeholder="${E(d.group_a)}" value="${d.teacher_a??''}"><input type=number class=tb min=0 max=${mx} placeholder="${E(d.group_b)}" value="${d.teacher_b??''}"></div>
<p>${T('wt')}: <b class=wv>${d.w_teacher}</b>% ${T('tch')}, <b class=sv>${100-d.w_teacher}</b>% ${T('stu')}</p><input type=range class=w min=0 max=100 step=5 value=${d.w_teacher} style="width:100%;accent-color:#0d1b2a"><br><br>
<p style="margin:0 0 6px">${T('mems')}</p><div class=row><textarea class=ma placeholder="${E(d.group_a)}">${E(d.members_a)}</textarea><textarea class=mb placeholder="${E(d.group_b)}">${E(d.members_b)}</textarea></div>
<div class=row><button class="btn s" data-a=save>${T('save')}</button><button class="btn o s" data-a=xD>${T('xl')}</button><button class="btn o s" data-a=wD>${T('wd')}</button><button class="btn o s" data-a=del>${T('del')}</button></div>
<div class=bd style="margin-top:12px"></div></div>`};
const qcard=z=>`<div class=card data-qid=${z.id}><div class=row><h2>${E(z.title)}</h2><span class="tag on qp"></span></div><div class=code>${z.code}</div>
<div class=row><button class="btn o s" data-a=qqr>${T('qr')}</button><button class="btn o s" data-a=qscr>${T('scr')}</button></div><br><button class="btn A" data-a=qgo></button><div class=qb></div>
<div class=row style="margin-top:12px"><button class="btn o s" data-a=xQ>${T('xl')}</button><button class="btn o s" data-a=wQ>${T('wd')}</button><button class="btn o s" data-a=qend>${T('last')}</button><button class="btn o s" data-a=qdel>${T('del')}</button></div></div>`;
function paint(){L.forEach(d=>{const c=document.querySelector(`[data-id="${d.id}"]`);if(c)c.querySelector('.bd').innerHTML=`<p style="margin:0">${T('live')}: ${d.a.n} / ${d.b.n} ${T('votes')}</p>`+board(d)});
 Q.forEach(z=>{const c=document.querySelector(`[data-qid="${z.id}"]`);if(!c)return;const last=z.qi+1>=z.questions.length,g=c.querySelector('[data-a=qgo]');
  c.querySelector('.qp').textContent=T('ph_'+z.phase);g.textContent={lobby:T('start'),q:T('reveal'),r:last?T('last'):T('next'),end:T('ph_end')}[z.phase];g.disabled=z.phase=='end';
  c.querySelector('.qb').innerHTML=`<p style="margin:10px 0 0">${z.players.length} ${T('plr')}${z.phase=='lobby'?'':`, ${T('qn')} ${z.qi+1}/${z.questions.length}`}</p>`+lb(z.players.slice(0,10))})}
function dash(){R=dash;clearInterval(tp);
 const fd=`<div class=card><h2>${T('newD')}</h2><input id=t type=text placeholder="${T('ttl')}"><div class=row><input id=ga type=text placeholder="${T('ga')}"><input id=gb type=text placeholder="${T('gb')}"></div><p style="margin:0 0 6px">${T('mem')}</p><div class=row><textarea id=ma></textarea><textarea id=mb></textarea></div><p style="margin:0 0 6px">${T('rub')}</p><textarea id=r>Arguments, 10\nRebuttal, 10\nEvidence, 10\nDelivery, 10</textarea><button class=btn id=mk>${T('mk')}</button></div>`;
 const fq=`<div class=card><h2>${T('newQ')}</h2><input id=qt2 type=text placeholder="${T('ttl')}"><p style="margin:0 0 6px">${T('qf')}</p><textarea id=qq style="min-height:140px">What is the capital of Iraq? | Erbil | Baghdad | Basra | Mosul | 2</textarea><input id=qs type=number value=20 min=5 max=120 placeholder="${T('secs')}"><p style="margin:-4px 0 12px">${T('secs')}</p><button class=btn id=mkq>${T('mkQ')}</button></div>`;
 app.innerHTML=`<div class=row style="margin-bottom:12px"><button class="btn ${tab=='a'?'':'o'}" data-t=a>${T('tabA')}</button><button class="btn ${tab=='q'?'':'o'}" data-t=q>${T('tabQ')}</button></div>`+(tab=='a'?fd+L.map(dcard).join(''):fq+Q.map(qcard).join(''))+`<div class=row><button class="btn o s" data-a=xall>${T('all')} (${T('xl')})</button><button class="btn o s" data-a=wall>${T('all')} (${T('wd')})</button><button class="btn o s" id=out>${T('out')}</button></div>`;
 paint();tp=setInterval(async()=>{if(document.hidden||!$('#out'))return;try{await load();paint()}catch{}},3000);
 app.oninput=e=>{if(e.target.classList.contains('w')){const c=e.target.closest('.card');c.querySelector('.wv').textContent=e.target.value;c.querySelector('.sv').textContent=100-e.target.value}};
 const re=async()=>{try{await load();dash()}catch(er){toast(er.message)}};
 app.onclick=async e=>{const t=e.target,a=t.dataset.a,id=t.id;
  if(t.dataset.t){tab=t.dataset.t;return dash()}
  if(id=='out'){sessionStorage.vp=P='';clearInterval(tp);return login()}
  if(id=='mk'){const rub=$('#r').value.split('\n').map(l=>l.split(',')).filter(a=>a[0].trim()&&+a[1]>0).map(a=>({name:a[0].trim(),max:+a[1]}));
   if(!$('#t').value.trim()||!$('#ga').value.trim()||!$('#gb').value.trim()||!rub.length)return toast(T('bad'));
   try{await rpc('vd_create',{p:P,t:$('#t').value.trim(),ga:$('#ga').value.trim(),gb:$('#gb').value.trim(),rub,ma:$('#ma').value,mb:$('#mb').value});await re()}catch(er){toast(er.message)}return}
  if(id=='mkq'){const sec=+$('#qs').value||20,qs=$('#qq').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a.length>=4&&a[0]).map(a=>{const c=+a.pop()-1;return{q:a[0],o:a.slice(1),c,t:sec}}).filter(x=>x.o.length>=2&&x.o.length<=4&&x.c>=0&&x.c<x.o.length);
   if(!$('#qt2').value.trim()||!qs.length)return toast(T('badQ'));try{await rpc('vq_create',{p:P,t:$('#qt2').value.trim(),qs});await re()}catch(er){toast(er.message)}return}
  if(a=='xall')return ex('x',L,Q);if(a=='wall')return ex('w',L,Q);
  const c=t.closest('.card[data-id]'),z=t.closest('.card[data-qid]');
  if(c){const d=L.find(x=>x.id==c.dataset.id),up=async p=>{try{await rpc('vd_update',{p:P,i:d.id,patch:p});await re()}catch(er){toast(er.message)}};
   if(a=='qr'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<h2 style="font-size:28px">${E(d.title)}</h2><div id=q style="margin:18px"></div><p>${T('scan')}</p><div class=code style="font-size:72px">${d.code}</div>`;o.onclick=()=>o.remove();document.body.append(o);const w=Math.min(300,innerWidth-80);mkqr($('#q'),d.code,w)}
   if(a=='tg')up({status:d.status=='open'?'closed':'open'});if(a=='rel')up({released:!d.released});
   if(a=='save'){const v=s=>c.querySelector(s).value;up({ta:v('.ta')===''?null:+v('.ta'),tb:v('.tb')===''?null:+v('.tb'),w:+v('.w'),ma:v('.ma'),mb:v('.mb')})}
   if(a=='xD')ex('x',[d],[]);if(a=='wD')ex('w',[d],[]);
   if(a=='del'&&confirm(T('conf'))){try{await rpc('vd_delete',{p:P,i:d.id});await re()}catch(er){toast(er.message)}}}
  if(z){const q=Q.find(x=>x.id==z.dataset.qid),ctl=async act=>{try{await rpc('vq_ctl',{p:P,i:q.id,act});await load();paint()}catch(er){toast(er.message)}};
   if(a=='qqr'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<h2 style="font-size:28px">${E(q.title)}</h2><div id=q style="margin:18px"></div><p>${T('scan')}</p><div class=code style="font-size:72px">${q.code}</div>`;o.onclick=()=>o.remove();document.body.append(o);mkqr($('#q'),q.code,Math.min(300,innerWidth-80))}
   if(a=='qscr'){const u=location.origin+location.pathname+'#screen='+q.code;try{await navigator.clipboard.writeText(u);toast(T('copied'))}catch{prompt('',u)}}
   if(a=='qgo'){const act={lobby:'start',q:'reveal',r:'next'}[q.phase];if(act)ctl(act)}
   if(a=='qend')ctl('end');if(a=='xQ')ex('x',[],[q]);if(a=='wQ')ex('w',[],[q]);
   if(a=='qdel'&&confirm(T('conf'))){try{await rpc('vq_delete',{p:P,i:q.id});await re()}catch(er){toast(er.message)}}}}}

/* ---------- Start ---------- */
applyL();
if('serviceWorker'in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js');
addEventListener('hashchange',()=>location.reload());
if(location.hash.startsWith('#screen='))screen(location.hash.slice(8));
else if(location.hash=='#teacher'){P?load().then(dash).catch(login):login()}
else join(new URLSearchParams(location.search).get('c')||'');
</script></body></html>
